services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hero_typing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hero_typing"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      HTTP_ADDR: ":8000"
      DB_DSN: postgres://postgres:postgres@postgres:5432/hero_typing?sslmode=disable
      JWT_SECRET: change-me-in-prod-please-32-bytes
      STATIC_DIR: /app/frontend/dist
      CORS_ALLOWED_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: